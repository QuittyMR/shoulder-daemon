name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [relay, advisor-echo]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Neither module has a dependency outside the standard library, so there
      # is no go.sum for the module cache to key on.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

      - name: go build
        run: go build ./...

      # The env file reader is checked against python-dotenv, which
      # podman-compose reads the file with; required so it is never skipped.
      - name: python-dotenv
        if: matrix.module == 'relay'
        run: python3 -m pip install --break-system-packages -q python-dotenv==1.2.2

      # The live provider and live memory tests skip themselves without their
      # credentials, and the integration suite is behind the `integration` build
      # tag, so this is the offline subset.
      - name: go test
        env:
          SHOULDER_DOTENV_REQUIRED: "1"
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  vulncheck:
    name: govulncheck ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [relay, advisor-echo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Zero dependencies still leaves the standard library, which is where the
      # CVEs that apply to a stdlib-only binary are filed.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: ${{ matrix.module }}
          go-version-file: ${{ matrix.module }}/go.mod
          go-package: ./...

  bench:
    name: hook round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false
      # The hook round trip is the number the whole design rests on. This does
      # not gate the merge; it records the cost in the job log.
      - name: benchmark
        working-directory: relay
        run: go test ./internal/pipeline/ -run '^$' -bench BenchmarkHookRoundTrip -benchtime 2000x
