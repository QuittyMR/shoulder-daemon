name: npm publish

# Publishes the OpenCode package for one release tag, by hand. The release
# workflow publishes on every tag push, but npm refuses to make a version
# "latest" by default when a higher one is already published, which is the
# case after a release has been withdrawn and re-cut under a lower number.
# This publishes under a temporary dist-tag, then moves "latest" explicitly,
# then removes the temporary tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: release tag to publish, vX.Y.Z
        required: true
      deprecate:
        description: version to mark deprecated, with the reason after a space; empty for none
        required: false
        default: ''

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: scripts/check-version.sh "${{ inputs.ref }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - working-directory: adapters/opencode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REF: ${{ inputs.ref }}
          DEPRECATE: ${{ inputs.deprecate }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is not set" >&2; exit 1; }
          ver="${REF#v}"
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver is already published; only the tags are set"
          else
            npm publish --access public --provenance --tag "publish-$ver"
          fi
          npm dist-tag add "$name@$ver" latest
          npm dist-tag rm "$name" "publish-$ver" || true
          if [ -n "$DEPRECATE" ]; then
            npm deprecate "$name@${DEPRECATE%% *}" "${DEPRECATE#* }"
          fi
          npm view "$name" dist-tags
