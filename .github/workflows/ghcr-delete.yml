name: ghcr delete

# Removes the container image versions that carry the given tags, by hand.
# The release workflow pushes an image for every tag; a release that has been
# withdrawn leaves its image behind, and nothing else deletes one.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: image tags to delete, separated by spaces, such as "0.6.0 0.6"
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ inputs.tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          base="/users/$OWNER/packages/container/shoulder-daemon/versions"
          versions="$(gh api --paginate "$base" --jq '.[] | "\(.id) \(.metadata.container.tags | join(","))"')"
          echo "before:"; echo "$versions" | grep -v ' $' || true
          # One version usually carries several tags, so the ids are
          # collected across every tag and each is deleted once.
          ids=""
          for tag in $TAGS; do
            found="$(echo "$versions" | awk -v t="$tag" '{ n = split($2, a, ","); for (i = 1; i <= n; i++) if (a[i] == t) print $1 }')"
            [ -n "$found" ] || { echo "no image version carries tag $tag" >&2; exit 1; }
            ids="$ids $found"
          done
          for id in $(echo "$ids" | tr ' ' '\n' | sort -u | grep .); do
            gh api -X DELETE "$base/$id"
            echo "deleted version $id"
          done
          echo "after:"; gh api --paginate "$base" --jq '.[] | "\(.id) \(.metadata.container.tags | join(","))"' | grep -v ' $' || true
