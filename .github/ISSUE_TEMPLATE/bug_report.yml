name: Bug report
description: Something the daemon, an adapter or the CLI does wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        `shoulderd doctor` answers most of this. Run it first and paste the output -
        it reports whether the daemon, the adapters and the settings on your machine
        agree with each other.

  - type: textarea
    id: doctor
    attributes:
      label: shoulderd doctor
      description: Full output. Redact your token if it appears.
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - OpenCode
        - Neither - the CLI or daemon directly
        - Other
    validations:
      required: true

  - type: input
    id: harness-version
    attributes:
      label: Harness version
      placeholder: "Claude Code 2.1.251"

  - type: input
    id: connector
    attributes:
      label: Model connector and memory backend
      description: The value of SHOULDER_LLM, and whether SHOULDER_MEMORY_URL is set.
      placeholder: "gemini; memory URL set (local mcp-memory)"

  - type: textarea
    id: logs
    attributes:
      label: Relay log
      description: >
        Set the log level to debug with `shoulderd config set --log-level=debug`, reproduce,
        and paste the relevant lines. Check them for secrets before posting.
      render: text
