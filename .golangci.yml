version: "2"

# Both modules have no dependency outside the standard library, so most of what
# a linter exists to catch never comes up. What is enabled beyond the defaults is
# the set that finds real defects in stdlib-only code: unwrapped errors, leaked
# response bodies, dead parameters, and spelling in strings a user will read.
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      # Closing a response body or a file on the way out has nothing to report
      # to; the deferred form is the idiom this code already uses.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    rules:
      # A test may ignore an error it has just proven cannot happen, and a test
      # helper is allowed to take a parameter every call passes the same value.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - unparam
      # The sanitiser's fixtures are the format characters it strips; escaping
      # them would hide what the test is about.
      - path: internal/sanitize/sanitize_test\.go
        text: ST1018
      # ParseDir's replacement lives in x/tools, which is a dependency.
      - path: internal/httpapi/server_test\.go
        text: SA1019

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
